# CyberBook local/production-like stack.
#
# NOTE: Docker is not available on the authoring machine; this compose file is
# provided as a reference and has not been run here. The working local setup
# (native PostgreSQL + `npm run dev:*`) is documented in the root README.
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up --build
#
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyberbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyberbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cyberbook
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      SEED_DEVELOPMENT_DATA: "true"
    ports:
      - "4000:4000"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Baked into the client bundle at build time. For a real deployment point
        # this at the public API URL.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:

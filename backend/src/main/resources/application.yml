server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: cyberbook-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cyberbook}
    username: ${DB_USERNAME:cyberbook}
    password: ${DB_PASSWORD:cyberbook}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:cyberbook-dev-secret-key-change-me-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  seed:
    enabled: ${SEED_DATA:true}

logging:
  level:
    com.cyberbook: INFO
    org.hibernate.SQL: WARN

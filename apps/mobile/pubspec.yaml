name: cyberbook_mobile
description: CyberBook — discover and reserve computer gaming club stations in Uzbekistan.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking + state
  dio: ^5.7.0
  provider: ^6.1.2

  # Storage (refresh/access tokens)
  shared_preferences: ^2.3.3

  # Formatting
  intl: ^0.19.0

  # Location (nearby clubs) — optional at runtime
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

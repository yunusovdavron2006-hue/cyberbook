name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyberbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cyberbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyberbook
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx --workspace @cyberbook/api prisma generate
      - name: Apply migrations
        run: npm run db:migrate --workspace @cyberbook/api
      - name: Seed (development data)
        run: npm run db:seed --workspace @cyberbook/api
        env:
          SEED_DEVELOPMENT_DATA: "true"
      - name: Lint
        run: npm run lint --workspace @cyberbook/api
      - name: Typecheck
        run: npm run typecheck --workspace @cyberbook/api
      - name: Unit tests
        run: npm run test --workspace @cyberbook/api
      - name: Build
        run: npm run build --workspace @cyberbook/api

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck --workspace @cyberbook/web
      - name: Build
        run: npm run build --workspace @cyberbook/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

  # Flutter is intentionally a separate, optional job because the SDK setup is
  # heavier. Enable once the mobile app is in active development.
  mobile:
    name: Mobile (analyze)
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
